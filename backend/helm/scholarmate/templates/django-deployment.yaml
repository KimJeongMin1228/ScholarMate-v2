apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-django
  labels:
    app.kubernetes.io/name: scholarmate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: django

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: django

  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarmate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: django

    spec:
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-django-config
            - secretRef:
                name: {{ .Values.secretName }}

          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.config.djangoAllowedHosts | quote }}

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.config.djangoAllowedHosts | quote }}

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}