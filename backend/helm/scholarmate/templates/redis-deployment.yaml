apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app.kubernetes.io/name: scholarmate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarmate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis

    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}

          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.targetPort }}
              protocol: TCP

          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu | quote }}
              memory: {{ .Values.redis.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.redis.resources.limits.cpu | quote }}
              memory: {{ .Values.redis.resources.limits.memory | quote }}