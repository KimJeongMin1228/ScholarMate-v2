replicaCount: 1

image:
  repository: ghcr.io/kimjeongmin1228/scholarmate-backend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  nodePort: null

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  djangoDebug: "False"
  djangoAllowedHosts: "api.scholarmate-v2.kro.kr"
  databaseHost: "scholarmate-db.csn0wog62msf.us-east-1.rds.amazonaws.com"
  databasePort: "3306"
  databaseName: "ScholarMate_db"
  databaseUser: "admin"

secretName: django-secret

redis:
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent

  service:
    port: 6379
    targetPort: 6379

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: true
  className: traefik
  host: api.scholarmate-v2.kro.kr
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: scholarmate-api-tls