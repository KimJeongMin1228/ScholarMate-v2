deployment:
  replicas: 1

service:
  type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30090
    redirectTo:
      port: websecure

  websecure:
    port: 8443
    exposedPort: 443
    nodePort: 30443
    tls:
      enabled: true

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

ingressClass:
  enabled: true
  isDefaultClass: false

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    level: INFO